<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HomTune Web UI preview — onboarding, home, and manual device entry.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HomTune Preview">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HomTune — Web UI Preview</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="font-family:system-ui,sans-serif;padding:2rem;text-align:center;color:#333;">
    <p style="font-size:1.1rem;margin:0 0 0.5rem;">HomTune を読み込み中…</p>
    <p style="font-size:0.85rem;color:#888;margin:0;">初回は数十秒かかることがあります</p>
  </div>
  <script>
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        var el = document.getElementById('loading');
        if (el) {
          el.innerHTML = '<p style="color:#b91c1c;font-weight:600;">読み込みに失敗しました</p>' +
            '<p style="font-size:0.85rem;color:#666;">Netlify には <code>build/web</code> フォルダ全体をアップロードしてください。<br>' +
            'リポジトリ直下の <code>web/</code> だけでは動きません。</p>';
        }
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
