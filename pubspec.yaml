name: homtune
description: 家庭内の家電や機材を最適に管理・調律するためのアプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 状態管理
  provider: ^6.1.1
  # データ永続化
  shared_preferences: ^2.2.2
  # JSON処理
  # (dart:convert を使用するため追加不要)
  # カメラ機能
  image_picker: ^1.0.5
  # ファイル管理
  path_provider: ^2.1.1
  # HTTP通信（将来のAPI連携用）
  http: ^1.1.0
  # URL起動（説明書リンク用）
  url_launcher: ^6.2.2
  # PDF表示
  pdfx: ^2.9.2
  # PDF生成
  pdf: ^3.11.3
  # ファイル選択
  file_picker: ^8.1.2
  # 画像処理
  image: ^4.3.0
  # ファイル操作
  path: ^1.9.0
  # Smart Ingester: バーコード・プレート撮影
  mobile_scanner: ^6.0.2
  # Smart Ingester: OCR（ML Kit）
  google_mlkit_text_recognition: ^0.13.0
  # Smart Ingester: Gemini 構造化抽出
  google_generative_ai: ^0.4.6
  # 説明書検索キャッシュ
  sqflite: ^2.3.2
  # 画像キャッシュ
  cached_network_image: ^3.3.1
  # 日付・数値フォーマット
  intl: ^0.19.0
  # グラフ描画
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/mock-data.json
    - assets/data/floor-plan.json
    - assets/data/safety-mock-data.json
    - assets/data/category-defaults.json
    - assets/data/room-appliance-templates.json
    - assets/images/
